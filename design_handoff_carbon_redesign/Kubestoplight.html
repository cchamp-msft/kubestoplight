<!DOCTYPE html>
<html lang="en" data-carbon-theme="g100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kubestoplight</title>

  <!-- Carbon Design System tokens + styles -->
  <link rel="stylesheet" href="_ds/carbon-design-system-496640ce-f611-4ae6-a719-9b98c9b0bec6/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/carbon-design-system-496640ce-f611-4ae6-a719-9b98c9b0bec6/tokens/colors.css">
  <link rel="stylesheet" href="_ds/carbon-design-system-496640ce-f611-4ae6-a719-9b98c9b0bec6/tokens/typography.css">
  <link rel="stylesheet" href="_ds/carbon-design-system-496640ce-f611-4ae6-a719-9b98c9b0bec6/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/carbon-design-system-496640ce-f611-4ae6-a719-9b98c9b0bec6/styles.css">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body, #root {
      height: 100%;
      background: var(--cds-background);
      color: var(--cds-text-primary);
      font-family: var(--cds-font-sans, 'IBM Plex Sans', sans-serif);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Dark scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--cds-border-subtle-01); }
    ::-webkit-scrollbar-thumb:hover { background: var(--cds-border-strong-01); }

    /* Link defaults */
    a { color: var(--cds-link-primary); }
    a:hover { color: var(--cds-link-primary-hover); }

    /* Card expand animation */
    .ksl-card-expand {
      animation: kslFadeIn 150ms cubic-bezier(0.2, 0, 0.38, 0.9);
    }
    @keyframes kslFadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Checkbox inline fix — Carbon checkboxes are block by default */
    .cds--checkbox-wrapper,
    .cds--form-item.cds--checkbox-wrapper {
      margin-bottom: 0 !important;
    }

    /* Toggle inline fix */
    .cds--toggle,
    .cds--form-item.cds--toggle {
      margin-bottom: 0 !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React 18 -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Carbon DS bundle -->
  <script src="_ds/carbon-design-system-496640ce-f611-4ae6-a719-9b98c9b0bec6/_ds_bundle.js"></script>

  <!-- App -->
  <script type="text/babel" src="ksl-components.jsx"></script>
  <script type="text/babel" src="ksl-app.jsx"></script>
</body>
</html>
